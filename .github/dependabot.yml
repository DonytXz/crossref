version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
      development-tooling:
        dependency-type: development
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      - dependency-name: tailwindcss
        versions:
          - ">=4.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
