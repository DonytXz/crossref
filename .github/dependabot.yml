version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      development-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      - dependency-name: tailwindcss
        versions:
          - ">=4.0.0"
      - dependency-name: jasmine-core
        versions:
          - ">=7.0.0"
      - dependency-name: "@types/jasmine"
        versions:
          - ">=7.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
